<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube RAG Assistant</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="logo-icon">▶️</span>
        <span class="brand-title">YT RAG Assistant</span>
      </div>
      <div class="status-badge" id="server-status" title="Checking server status...">
        <span class="status-dot"></span>
        <span class="status-text">Connecting...</span>
      </div>
    </header>

    <!-- Video Preview Card -->
    <div class="video-card" id="video-card">
      <div class="video-thumbnail-wrapper">
        <img id="video-thumb" src="" alt="Video Thumbnail">
      </div>
      <div class="video-meta">
        <h4 id="video-title">Detecting YouTube video...</h4>
        <span class="video-id-badge" id="video-id-badge">No Video Active</span>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="tab-btn active" id="tab-chat-btn">
        <span>💬</span> Chat
      </button>
      <button class="tab-btn" id="tab-summary-btn">
        <span>⚡</span> Summary
      </button>
    </nav>

    <!-- Main Content Area -->
    <main class="content-area">
      <!-- Chat Tab Panel -->
      <section class="tab-panel active" id="chat-panel">
        <div class="chat-history" id="chat-history">
          <div class="welcome-message">
            <p>👋 Ask anything about the active YouTube video! Answers include clickable timestamp citations.</p>
          </div>
        </div>

        <div class="input-bar">
          <input type="text" id="chat-input" placeholder="Ask a question about this video..." autocomplete="off">
          <button id="send-btn" title="Send Question">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </section>

      <!-- Summary Tab Panel -->
      <section class="tab-panel" id="summary-panel">
        <div class="summary-actions">
          <button class="btn-primary" id="generate-summary-btn">
            ✨ Generate Executive Summary
          </button>
        </div>
        <div class="summary-container" id="summary-container">
          <p class="placeholder-text">Click the button above to analyze the transcript and generate key insights with timestamps.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
